<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Russian Cyrillic Decoder </title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Golos+Text:ital,wght@0,400..900;1,400..900&family=Literata:ital,opsz,wght@0,7..72,200..900;1,7..72,200..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
    <!--Global nav thingy I gotta inject by util.js-->
    <header id="global-header" class="sticky-nav"></header>

    <main class="container">
        <div class="alphabet-column">
            <!-- Category filter bar -->
            <div class="filter-bar" id="category-filters">
                <button type="button" class="filter-pill active" data-category="all">All 33</button>
                <button type="button" class="filter-pill" data-category="true-friends">True Friends</button>
                <button type="button" class="filter-pill" data-category="false-friends">False Friends</button>
                <button type="button" class="filter-pill" data-category="slavic">Slavic Originals</button>
                <button type="button" class="filter-pill" data-category="modifiers">Modifiers (Ъ, Ы, Ь)</button>
            </div>

            <section id="alphabet-grid" class="alphabet-grid" aria-label="Russian Alphabet"></section>
        </div>
        
        <aside id="inspector-panel" class="inspector-panel" hidden aria-label="Letter Details"></aside>
    </main>

    <!-- Cursive Trap Decoder Section AAAAAAAAAAAAAAAAAA (┬┬﹏┬┬)-->
    <section class="trap-decoder-section" aria-label="Cursive Trap Decoder">
        <div class="trap-decoder-header">
            <h2>The Cursive Trap Decoder</h2>
            <p>In Russian handwriting, letters like <em>и, ш, л, м, т, п</em> create continuous loops. Hover or tap each letter below to deconstruct the strokes.</p>
        </div>

        <div class="trap-selector-bar" id="trap-selector-bar">
            <!-- buttons injected by js i wonder if anyone reads the whole code to review lwk, if someone is reading this i wanna get a "(～﹃～)~zZ" in my review email MUEHEHEHEHE-->
        </div>

        <div class="trap-stage" id="trap-stage">
            <div class="trap-word-display ru-text" id="trap-word-display"></div>
            <p class="trap-meta" id="trap-meta"></p>
            <p class="trap-note" id="trap-note"></p>
        </div>
    </section>
    <script type="module" src="scripts/utils.js"></script>
    <script type="module" src="scripts/alphabet.js"></script>
</body>
</html>
